# ╔══════════════════════════════════════════════════════════════╗
# ║           KAMLOG API — Nginx Production Config              ║
# ║  Place in /etc/nginx/sites-available/kamlog-api             ║
# ║  Symlink: ln -s ../sites-available/kamlog-api sites-enabled ║
# ╚══════════════════════════════════════════════════════════════╝

# Rate limiting zones (applied before PHP processing)
limit_req_zone $binary_remote_addr zone=api_global:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=api_auth:5m rate=5r/m;
limit_req_zone $binary_remote_addr zone=api_forms:5m rate=3r/m;

# Upstream PHP-FPM
upstream php_fpm {
    server unix:/var/run/php/php8.3-fpm.sock;
    # server 127.0.0.1:9000;  # Alternative: TCP
}

# Redirect HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name api.kamlog.com;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.kamlog.com;

    root /var/www/kamlog-backend/public;
    index index.php;

    # ── SSL ──────────────────────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/api.kamlog.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.kamlog.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # ── Logging ─────────────────────────────────────────────
    access_log /var/log/nginx/kamlog-api-access.log combined buffer=16k flush=5s;
    error_log  /var/log/nginx/kamlog-api-error.log warn;

    # ── Performance ─────────────────────────────────────────
    client_max_body_size 20M;
    client_body_buffer_size 128k;
    keepalive_timeout 65;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    # ── Gzip (fallback — app also compresses via middleware) ─
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 4;
    gzip_min_length 1024;
    gzip_types application/json application/javascript text/plain text/css;

    # ── Security headers (defense in depth — app also sets these)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Block common attack paths ───────────────────────────
    location ~ /\.(env|git|svn|htaccess) {
        deny all;
        return 404;
    }

    location ~* (composer\.(json|lock)|package\.json|artisan)$ {
        deny all;
        return 404;
    }

    # ── Static files (images, storage) ──────────────────────
    location /storage/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # ── API rate limiting per zone ──────────────────────────
    # Auth endpoints: strict rate limiting
    location ~ ^/api/v1/admin/auth/ {
        limit_req zone=api_auth burst=3 nodelay;
        limit_req_status 429;
        try_files $uri /index.php?$query_string;
    }

    # Public form submissions: moderate rate limiting
    location ~ ^/api/v1/(contact|newsletter|visit-requests|quote-requests)$ {
        limit_req zone=api_forms burst=2 nodelay;
        limit_req_status 429;
        try_files $uri /index.php?$query_string;
    }

    # ── Main location ───────────────────────────────────────
    location / {
        limit_req zone=api_global burst=20 nodelay;
        limit_req_status 429;
        try_files $uri /index.php?$query_string;
    }

    # ── PHP-FPM ─────────────────────────────────────────────
    location ~ ^/index\.php(/|$) {
        fastcgi_pass php_fpm;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;

        # Performance tuning
        fastcgi_buffer_size 32k;
        fastcgi_buffers 16 16k;
        fastcgi_busy_buffers_size 64k;
        fastcgi_read_timeout 60s;
        fastcgi_connect_timeout 5s;

        # Hide PHP-FPM from outside
        internal;
    }

    # Block all other .php files
    location ~ \.php$ {
        return 404;
    }
}
