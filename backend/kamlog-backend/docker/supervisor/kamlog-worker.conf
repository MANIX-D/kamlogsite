# ╔══════════════════════════════════════════════════════════════╗
# ║        KAMLOG — Supervisor Queue Worker Config              ║
# ║  Place in /etc/supervisor/conf.d/kamlog-worker.conf         ║
# ║  Then: supervisorctl reread && supervisorctl update         ║
# ╚══════════════════════════════════════════════════════════════╝

[program:kamlog-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/kamlog-backend/artisan queue:work redis --sleep=3 --tries=3 --max-time=3600 --memory=128
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/kamlog-backend/storage/logs/worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stopwaitsecs=30
